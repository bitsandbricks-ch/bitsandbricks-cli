[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bitsandbricks-cli"
dynamic = ["version"]
description = "bitsandbricks (bnb): one terminal tool, CLI and TUI, for your GitHub orgs: PRs, runs, approvals, security alerts, and repo defaults kept in a defaults repo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
tui = ["textual>=1.0"]
market = ["cryptography>=42"]
operator = ["flask>=3.0", "sqlalchemy>=2.0", "cryptography>=42", "gunicorn>=22"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "textual>=1.0", "flask>=3.0", "sqlalchemy>=2.0", "cryptography>=42"]

[project.scripts]
bitsandbricks = "bitsandbricks.cli:main"
bnb = "bitsandbricks.cli:main"
bnb-operator = "bitsandbricks.operator.app:main"

[tool.hatch.version]
path = "src/bitsandbricks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bitsandbricks"]
artifacts = ["src/bitsandbricks/operator/static/**"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLW1510", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/bitsandbricks/templates.py" = ["E501"]
