[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mortar-cli"
dynamic = ["version"]
description = "Mortar (mtr): one CLI, TUI and web app for your GitHub and GitLab repos: PRs, runs, approvals, security alerts, stats, and repo defaults kept in a defaults repo"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
tui = ["textual>=1.0"]
market = ["cryptography>=42"]
server = ["flask>=3.0", "sqlalchemy>=2.0", "cryptography>=42", "gunicorn>=22"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.6", "textual>=1.0", "flask>=3.0", "sqlalchemy>=2.0", "cryptography>=42"]

[project.scripts]
mtr = "mortar.cli:main"
mortar = "mortar.cli:main"
mortar-server = "mortar.server.app:main"

[tool.hatch.version]
path = "src/mortar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mortar"]
artifacts = ["src/mortar/server/static/**"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLW1510", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/mortar/templates.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mortar"]
