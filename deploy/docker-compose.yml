# Mason, the web app, with Postgres, from the image CI publishes to GHCR.
# Put it behind a TLS proxy (Caddy, Traefik, nginx) that serves MASON_URL and forwards to 127.0.0.1:8080.
#   cd deploy
#   cp .env.example .env      # fill in MASON_URL, the OAuth apps and POSTGRES_PASSWORD
#   docker compose up -d
#   docker compose run --rm mason mason serve --check   # what the settings allow, and what is missing
# Build from this checkout instead of pulling: docker compose up -d --build
services:
  mason:
    image: ghcr.io/bitsandbricks-ch/mason-cli:${MASON_TAG:-latest}
    build: ..
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://mason:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/mason
      MASON_TRUSTED_PROXIES: ${MASON_TRUSTED_PROXIES:-1}
    ports: ["127.0.0.1:8080:8080"]
    volumes: [data:/data]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mason
      POSTGRES_DB: mason
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mason", "-d", "mason"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes: { data: {}, db: {} }
